apiVersion: apps/v1
kind: Deployment
metadata:
  name: node-svc
  namespace: default
  labels:
    app: node-svc
    app.kubernetes.io/managed-by: grad-deploy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: node-svc
  template:
    metadata:
      labels:
        app: node-svc
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: node-svc
          image: "node-svc:latest"
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              memory: "512Mi"
          envFrom:
            - configMapRef:
                name: node-svc-config
            - secretRef:
                name: node-svc-secret
                optional: true
          livenessProbe:
            httpGet:
              path: /healthz
              port: 3000
            periodSeconds: 30
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: 3000
            periodSeconds: 10
            failureThreshold: 3