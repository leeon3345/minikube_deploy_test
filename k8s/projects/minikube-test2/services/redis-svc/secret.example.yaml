# ⚠️ 이 파일은 .gitignore로 보호됩니다
# GitHub Actions에서 Secrets를 통해 값이 주입됩니다
apiVersion: v1
kind: Secret
metadata:
  name: redis-svc-secret
  namespace: default
  labels:
    app: redis-svc
    app.kubernetes.io/managed-by: grad-deploy
type: Opaque
stringData:
  REDIS_PASSWORD: "${{ secrets.REDIS_PASSWORD }}"