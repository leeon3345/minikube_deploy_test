apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: minikube-test2
  namespace: argocd
  labels:
    app.kubernetes.io/managed-by: grad-deploy
    grad-deploy/project: "minikube-test2"
spec:
  project: minikube-test2-project
  source:
    repoURL: https://github.com/leeon3345/minikube_deploy_test
    targetRevision: HEAD
    path: k8s/projects/minikube-test2/overlays/production
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
  ignoreDifferences:
    - group: apps
      kind: Deployment
      jsonPointers: [/spec/replicas]