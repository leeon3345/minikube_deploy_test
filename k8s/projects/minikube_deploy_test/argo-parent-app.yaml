apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: minikube_deploy_test
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  labels:
    app.kubernetes.io/managed-by: grad-deploy
    grad-deploy/owner: "minikube_deploy_test"
    grad-deploy/role: parent
spec:
  project: minikube_deploy_test-project
  source:
    repoURL: https://github.com/leeon3345/minikube_deploy_test
    targetRevision: HEAD
    path: k8s/projects/minikube_deploy_test
    directory:
      recurse: false
      include: 'argo-appset.yaml'
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true