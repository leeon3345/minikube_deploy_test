apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-cm
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: argocd
    app.kubernetes.io/managed-by: grad-deploy
  annotations:
    grad-deploy/note: >
      플랫폼 담당자 전용. Application sync 대상에서 제외할 것.
      변경: kubectl apply -f k8s/argocd-admin/argocd-cm.yaml -n argocd
      SSO 설정 후 반드시 setup.sh 를 실행해 Client Secret 을 주입하세요.
data:
  # ── GitHub SSO (Dex OIDC) ────────────────────────────
  # 사전 준비 (GitHub OAuth App 생성):
  #   GitHub → Settings → Developer settings → OAuth Apps → New OAuth App
  #   Homepage URL   : https://https://localhost:8080
  #   Callback URL   : https://https://localhost:8080/api/dex/callback
  #
  # Client ID  → DeployPanel "SSO 설정" 탭에 입력 → GitHub Secret ARGOCD_GITHUB_CLIENT_ID 에 저장
  # Client Secret → setup.sh 를 실행해 argocd-secret 에 직접 주입 (Git 에 저장 금지)
  dex.config: |
    connectors:
      - type: github
        id: github
        name: GitHub
        config:
          clientID: REPLACE_WITH_OAUTH_CLIENT_ID
          clientSecret: $dex.github.clientSecret
          redirectURI: https://https://localhost:8080/api/dex/callback

  # ── 리소스 커스터마이징 ─────────────────────────────
  # HPA 가 replicas 를 자동 조정할 때 spec.replicas diff 로 OutOfSync 오탐 방지
  resource.customizations.ignoreDifferences.apps_Deployment: |
    jsonPointers:
      - /spec/replicas

  # ── 상태 배지 + 리소스 추적 방식 ──────────────────────
  statusbadge.enabled: "true"
  application.resourceTrackingMethod: label

  # ── UI 배너 ───────────────────────────────────────────
  ui.bannercontent: "Grad-Deploy Managed Cluster — minikube_deploy_test"
  ui.bannerurl: "https://https://localhost:8080"